[package]
name = "ruby"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
description = "Ruby: a fast, lightweight, native alternative to Obsidian"

[[bin]]
name = "Ruby"
path = "src/main.rs"

[dependencies]
ruby-core = { path = "../core" }
gpui-kit = { version = "0.9.0", features = ["tree-sitter-bash", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-yaml", "tree-sitter-toml", "tree-sitter-lua", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-csharp", "tree-sitter-go", "tree-sitter-html", "tree-sitter-css", "tree-sitter-sql"] }
dirs = "6"
anyhow = "1"
notify-debouncer-full = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
sys-locale = "0.3"
base64 = "0.22"

[dev-dependencies]
gpui-kit = { version = "0.9.0", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"
